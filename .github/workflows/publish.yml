name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  gate:
    uses: GenvidTechnologies/public-github-actions/.github/workflows/node-gate.yml@main
    with:
      # Same opt-in as ci.yml, so the release gate grades the pinned construct3-sample
      # fixture (and the SDK/ submodule) instead of self-skipping, and fails when the pin
      # cannot be verified (#93, ADR 0030).
      submodules: recursive
      extra-env: |
        PREP_FIXTURE_STRICT=1

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public
